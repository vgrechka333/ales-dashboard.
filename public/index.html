<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Регистрации в боте — дашборд</title>
<script src="chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262a33;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #6c5ce7;
    --good: #2ecc71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .status { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--good); margin-right: 6px; }
  .warn { color: #f39c12; }
</style>
</head>
<body>

<h1>📊 Регистрации в боте</h1>
<div class="sub">Данные подтягиваются из Salebot автоматически. Обновление на экране — каждые 30 секунд.</div>

<div class="cards">
  <div class="card">
    <div class="label">Всего регистраций</div>
    <div class="value" id="total">—</div>
  </div>
  <div class="card">
    <div class="label">Сегодня</div>
    <div class="value" id="today">—</div>
  </div>
  <div class="card">
    <div class="label">За 7 дней</div>
    <div class="value" id="last7">—</div>
  </div>
</div>

<div class="panel">
  <h2>Динамика по дням</h2>
  <canvas id="chart" height="90"></canvas>
</div>

<div class="panel">
  <h2>Последние 20 регистраций</h2>
  <table>
    <thead><tr><th>Имя</th><th>ID клиента</th><th>Дата</th></tr></thead>
    <tbody id="recentTable"></tbody>
  </table>
</div>

<div class="status"><span class="dot"></span><span id="statusText">подключение...</span></div>

<script>
let chart;

async function loadStats() {
  try {
    const res = await fetch('/api/stats?days=30');
    const data = await res.json();

    document.getElementById('total').textContent = data.total;
    document.getElementById('today').textContent = data.todayCount;
    document.getElementById('last7').textContent = data.last7;

    const labels = data.byDay.map(d => d.day.slice(5));
    const values = data.byDay.map(d => d.n);

    if (!chart) {
      const ctx = document.getElementById('chart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Регистрации',
            data: values,
            borderColor: '#6c5ce7',
            backgroundColor: 'rgba(108,92,231,.15)',
            fill: true,
            tension: .3,
            pointRadius: 2
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#8b8f9a' }, grid: { color: '#262a33' } },
            y: { ticks: { color: '#8b8f9a' }, grid: { color: '#262a33' }, beginAtZero: true }
          }
        }
      });
    } else {
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.update();
    }

    const recent = document.getElementById('recentTable');
    recent.innerHTML = data.recent.map(r =>
      `<tr>
        <td>${r.name || '—'}</td>
        <td>${r.client_id}</td>
        <td>${r.created_at}</td>
      </tr>`
    ).join('') || '<tr><td colspan="3">пока нет данных</td></tr>';

    document.getElementById('statusText').textContent =
      'обновлено ' + new Date().toLocaleTimeString('ru-RU');
  } catch (e) {
    document.getElementById('statusText').innerHTML = '<span class="warn">ошибка загрузки данных</span>';
  }
}

loadStats();
setInterval(loadStats, 30000);
</script>

</body>
</html>
